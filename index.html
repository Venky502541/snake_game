<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snake Game</title>
  <style>
    /* Basic Reset and Font */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      height: 100vh;
      background: #212837;
      color: #b8c6dc;
      user-select: none;
    }
    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #293447;
      border-radius: 8px;
      box-shadow: 0 20px 40px rgba(52, 87, 220, 0.2);
      width: 600px;
      height: 650px;
      padding: 10px;
      position: relative;
    }
    .scoreboard {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      font-size: 1.2rem;
      padding: 10px 20px;
    }
    .play-board {
      position: relative;
      background: #121826;
      width: 600px;
      height: 600px;
      display: grid;
      grid-template-columns: repeat(30, 1fr);
      grid-template-rows: repeat(30, 1fr);
      border-radius: 5px;
      overflow: hidden;
      touch-action: none;
    }
    .snake {
      background: #60cbff;
      border-radius: 2px;
      grid-column-start: var(--x);
      grid-row-start: var(--y);
    }
    .food {
      background: #ff003d;
      border-radius: 2px;
      grid-column-start: var(--x);
      grid-row-start: var(--y);
    }
    .game-over {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      color: #ff003d;
      font-size: 2.5rem;
      padding: 30px 40px;
      border-radius: 10px;
      text-align: center;
      display: none;
      z-index: 10;
    }
    .control-buttons {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      gap: 10px;
      user-select: none;
    }
    .control-buttons button {
      width: 60px;
      height: 60px;
      border-radius: 6px;
      border: none;
      font-size: 1.5rem;
      font-weight: bold;
      background: #60cbff;
      color: #212837;
      cursor: pointer;
      transition: background 0.3s ease;
      touch-action: manipulation;
    }
    .control-buttons button:active {
      background: #45aeee;
    }
    .vertical-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-left: 10px;
    }
    @media(max-width: 650px) {
      .game-container {
        width: 100vw;
        height: 100vw;
        max-width: 600px;
        max-height: 650px;
        padding: 5px;
      }
      .play-board {
        width: 100vw;
        height: 100vw;
        max-width: 600px;
        max-height: 600px;
      }
      .control-buttons {
        flex-wrap: wrap;
      }
      .control-buttons button {
        width: 48px;
        height: 48px;
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="scoreboard">
      <div>Score: <span id="score">0</span></div>
      <div>High Score: <span id="highScore">0</span></div>
    </div>
    <div class="play-board" id="playBoard"></div>
    <div class="game-over" id="gameOverMessage">
      Game Over!<br />
      <button id="restartBtn">Restart</button>
    </div>
    <div class="control-buttons" id="mobileControls" aria-label="Mobile direction controls">
      <button id="upBtn" aria-label="Move Up">▲</button>
      <div style="display:flex;">
        <button id="leftBtn" aria-label="Move Left">◄</button>
        <button id="downBtn" aria-label="Move Down">▼</button>
        <button id="rightBtn" aria-label="Move Right">►</button>
      </div>
    </div>
  </div>

  <script>
    const playBoard = document.getElementById("playBoard");
    const scoreElem = document.getElementById("score");
    const highScoreElem = document.getElementById("highScore");
    const gameOverMessage = document.getElementById("gameOverMessage");
    const restartBtn = document.getElementById("restartBtn");

    const upBtn = document.getElementById("upBtn");
    const downBtn = document.getElementById("downBtn");
    const leftBtn = document.getElementById("leftBtn");
    const rightBtn = document.getElementById("rightBtn");

    const gridSize = 30;

    let snake = [
      { x: 14, y: 14 }
    ];
    // Start moving to the right by default
    let velocity = { x: 1, y: 0 };
    let food = { x: 0, y: 0 };
    let score = 0;
    let highScore = localStorage.getItem("highScore") || 0;
    highScoreElem.textContent = highScore;
    let gameRunning = true;

    function placeFood() {
      food.x = Math.floor(Math.random() * gridSize) + 1;
      food.y = Math.floor(Math.random() * gridSize) + 1;

      // Make sure food does not appear on the snake
      if (snake.some(segment => segment.x === food.x && segment.y === food.y)) {
        placeFood();
      }
    }

    function update() {
      if (!gameRunning) return;

      const head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

      // Wall collision check
      if (head.x < 1 || head.x > gridSize || head.y < 1 || head.y > gridSize) {
        return gameOver();
      }

      // Self collision check
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      // Check if food is eaten
      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreElem.textContent = score;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem("highScore", highScore);
          highScoreElem.textContent = highScore;
        }
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      playBoard.innerHTML = '';

      // Draw food
      const foodElem = document.createElement("div");
      foodElem.style.setProperty('--x', food.x);
      foodElem.style.setProperty('--y', food.y);
      foodElem.classList.add("food");
      playBoard.appendChild(foodElem);

      // Draw snake
      snake.forEach(segment => {
        const snakeElem = document.createElement("div");
        snakeElem.style.setProperty('--x', segment.x);
        snakeElem.style.setProperty('--y', segment.y);
        snakeElem.classList.add("snake");
        playBoard.appendChild(snakeElem);
      });
    }

    function gameOver() {
      gameRunning = false;
      gameOverMessage.style.display = "block";
    }

    // Keyboard controls
    function changeDirection(e) {
      const key = e.key;
      if (!gameRunning) return;

      if (key === "ArrowUp" && velocity.y !== 1) {
        velocity = { x: 0, y: -1 };
      } else if (key === "ArrowDown" && velocity.y !== -1) {
        velocity = { x: 0, y: 1 };
      } else if (key === "ArrowLeft" && velocity.x !== 1) {
        velocity = { x: -1, y: 0 };
      } else if (key === "ArrowRight" && velocity.x !== -1) {
        velocity = { x: 1, y: 0 };
      }
    }

    // Mobile buttons control
    function btnControl(direction) {
      if (!gameRunning) return;

      switch (direction) {
        case 'up':
          if (velocity.y !== 1) velocity = { x: 0, y: -1 };
          break;
        case 'down':
          if (velocity.y !== -1) velocity = { x: 0, y: 1 };
          break;
        case 'left':
          if (velocity.x !== 1) velocity = { x: -1, y: 0 };
          break;
        case 'right':
          if (velocity.x !== -1) velocity = { x: 1, y: 0 };
          break;
      }
    }

    function restartGame() {
      score = 0;
      scoreElem.textContent = score;
      snake = [{ x: 14, y: 14 }];
      velocity = { x: 1, y: 0 };
      gameRunning = true;
      gameOverMessage.style.display = "none";
      placeFood();
      draw();
    }

    window.addEventListener("keydown", changeDirection);
    restartBtn.addEventListener("click", restartGame);

    upBtn.addEventListener("touchstart", () => btnControl('up'), { passive: true });
    downBtn.addEventListener("touchstart", () => btnControl('down'), { passive: true });
    leftBtn.addEventListener("touchstart", () => btnControl('left'), { passive: true });
    rightBtn.addEventListener("touchstart", () => btnControl('right'), { passive: true });

    placeFood();
    draw();

    setInterval(update, 100);
  </script>
</body>
</html>
